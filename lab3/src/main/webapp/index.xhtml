<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:outputStylesheet name="css/index.css"/>

<h:head>
    <title>Стартовая, лаба 3</title>
    <h:outputScript name="scripts/clock.js" />

</h:head>

<h:body>
    <div class="header">
        <h1>Лабораторная работа три</h1>
        <h2>Красногорский Тимофей, Р3220 <br/>Вариант 29752</h2>
    </div>

    <div id="clock-container" class="clock-container">
        <h:panelGroup id="clock-svg">
        <h:inputHidden id="hourAngle" value="#{timeBean.hour * 30 + timeBean.minute * 0.5}"/>
        <h:inputHidden id="minuteAngle" value="#{timeBean.minute * 6}"/>
        <h:inputHidden id="secondAngle" value="#{timeBean.second * 6}"/>
        <h:inputHidden id="digitalTime" value="#{timeBean.hour}:#{timeBean.minute lt 10 ? '0' : ''}#{timeBean.minute}:#{timeBean.second lt 10 ? '0' : ''}#{timeBean.second}"/>
        <h:inputHidden id="currentDate" value="#{timeBean.date}"/>
        <svg width="200" height="300" xmlns="http://www.w3.org/2000/svg" class="analog-clock">
            <circle cx="100" cy="100" r="95" fill="white" stroke="black" stroke-width="2"/>


            <g id="hour-marks">
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(30,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(60,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(90,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(120,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(150,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(180,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(210,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(240,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(270,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(300,100,100)"/>
                <line x1="100" y1="15" x2="100" y2="25" stroke="black" stroke-width="3" transform="rotate(330,100,100)"/>
            </g>

            <text x="100" y="40" text-anchor="middle" font-family="Arial" font-size="14" fill="black">12</text>
            <text x="165" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="black">3</text>
            <text x="100" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="black">6</text>
            <text x="35" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="black">9</text>


            <line id="hour-hand" x1="100" y1="100" x2="100" y2="60"
                  stroke="black" stroke-width="6" stroke-linecap="round"
                  transform="rotate(0,100,100)"/>


            <line id="minute-hand" x1="100" y1="100" x2="100" y2="40"
                  stroke="black" stroke-width="4" stroke-linecap="round"
                  transform="rotate(0,100,100)"/>

            <line id="second-hand" x1="100" y1="100" x2="100" y2="30"
                  stroke="red" stroke-width="2" stroke-linecap="round"
                  transform="rotate(0,100,100)"/>

            <text id="date-text" x="100" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="black">
                Loading...
            </text>

        </svg>
        </h:panelGroup>

        <h:commandButton id="refreshClock"
                         action="#{timeBean.updateTime}"
                         value="Обновить время"
                         style="display:none">
            <f:ajax execute="@this" render="hourAngle minuteAngle secondAngle digitalTime currentDate"/>
        </h:commandButton>
    </div>


    <h:form id="form" styleClass="buttons-container" >
        <h:commandButton value="Главная" styleClass="data-button" id="go-to-main-button" action="toMain"/>
    </h:form>

</h:body>
</html>
